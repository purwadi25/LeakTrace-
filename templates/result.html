<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - LeakTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">🔐 LeakTrace</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> Dokumen</a></li>
                <li class="nav-item"><a class="nav-link" href="/distributions"><i class="bi bi-share"></i> Distribusi</a></li>
                <li class="nav-item"><a class="nav-link" href="/history"><i class="bi bi-clock-history"></i> Riwayat</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card card-custom p-5 text-center">
                <div class="card-body">
                    
                    {% if status == 'warning' %}
                        <i class="bi bi-exclamation-triangle-fill display-1 text-warning mb-3"></i>
                    {% else %}
                        <i class="bi bi-check-circle-fill display-1 text-success mb-3"></i>
                    {% endif %}
                    
                    <h2 class="font-weight-700 mb-4">{{ title }}</h2>
                    
                    <div class="alert alert-light border shadow-sm text-start hash-box mb-4" style="font-size: 1.1rem; line-height: 1.8;">
                        {{ message | safe }}
                    </div>
                    
                    <div class="mt-4">
                        <a href="{{ back_link }}" class="btn btn-primary rounded-pill px-5 font-weight-600">
                            Kembali
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
