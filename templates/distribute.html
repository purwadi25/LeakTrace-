<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribusi Dokumen - LeakTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">🔐 LeakTrace</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> Dokumen</a></li>
                <li class="nav-item"><a class="nav-link active" href="/distributions"><i class="bi bi-share"></i> Distribusi</a></li>
                <li class="nav-item"><a class="nav-link" href="/history"><i class="bi bi-clock-history"></i> Riwayat</a></li>
            </ul>
            <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="mb-4">
                <a href="/" class="btn btn-sm btn-light text-secondary rounded-pill"><i class="bi bi-arrow-left"></i> Kembali</a>
            </div>
            <div class="card card-custom p-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <i class="bi bi-megaphone display-4 text-success mb-2"></i>
                        <h2 class="font-weight-700">Distribusikan Dokumen</h2>
                        <p class="text-muted">Generate fingerprint unik PDF untuk penerima spesifik.</p>
                    </div>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary font-weight-600">1. Pilih Dokumen Master</label>
                            <select name="document_id" class="form-select form-select-lg" required>
                                <option value="" disabled selected>-- Pilih Dokumen --</option>
                                {% for doc in documents %}
                                <option value="{{ doc[0] }}">ID: {{ doc[0] }} - {{ doc[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary font-weight-600">2. Nama Lengkap Penerima</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" name="recipient_name" class="form-control" placeholder="Contoh: John Doe" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-lg rounded-pill w-100 font-weight-600 text-white">
                            <i class="bi bi-patch-check me-2"></i> Proses & Generate Fingerprint PDF
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
