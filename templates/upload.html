<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Dokumen - LeakTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container">
        <a class="navbar-brand" href="/">🔐 LeakTrace</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link active" href="/documents"><i class="bi bi-file-earmark-text"></i> Dokumen</a></li>
                <li class="nav-item"><a class="nav-link" href="/distributions"><i class="bi bi-share"></i> Distribusi</a></li>
                <li class="nav-item"><a class="nav-link" href="/history"><i class="bi bi-clock-history"></i> Riwayat</a></li>
            </ul>
            <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="mb-4">
                <a href="/" class="btn btn-sm btn-light text-secondary rounded-pill"><i class="bi bi-arrow-left"></i> Kembali</a>
            </div>
            <div class="card card-custom p-4">
                <div class="card-body">
                    <h2 class="font-weight-700 text-center mb-1">Upload Dokumen Master</h2>
                    <p class="text-muted text-center mb-4">File ini akan menjadi acuan (Original) untuk didistribusikan.</p>
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-4 text-center file-drop-area">
                            <i class="bi bi-file-earmark-pdf display-1 text-primary mb-3"></i>
                            <h6 class="text-secondary mb-3">Pilih file PDF Dokumen Master</h6>
                            <input type="file" name="document" class="form-control" accept=".pdf" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 font-weight-600">
                            <i class="bi bi-cloud-upload me-2"></i> Mulai Upload & Generate Hash
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
