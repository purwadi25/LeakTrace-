<!DOCTYPE html>
<html>
<head>

    <title>LeakTrace Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">
        🔐 LeakTrace Dashboard
    </h1>

    <a href="/logout" class="btn btn-danger float-end">
    Logout
    </a>

    <div class="row">

        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Total Dokumen</h5>
                    <h1>{{ total_documents }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Total Distribusi</h5>
                    <h1>{{ total_distributions }}</h1>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h5>Total Investigasi</h5>
                    <h1>{{ total_investigations }}</h1>
                </div>
            </div>
        </div>

    </div>

    <hr class="my-4">

    <div class="d-grid gap-3">

        <a href="/upload" class="btn btn-primary">
            Upload Dokumen
        </a>

        <a href="/distribute" class="btn btn-success">
            Distribusi Dokumen
        </a>

        <a href="/investigation" class="btn btn-warning">
            Investigasi Dokumen
        </a>

        <a href="/history" class="btn btn-dark">
            Riwayat Investigasi
        </a>

    </div>

</div>

</body>
</html>
