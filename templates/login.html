<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LeakTrace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-wrapper">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-custom p-4">
                <div class="card-body">
                    <div class="brand-logo">🔐 LeakTrace</div>
                    <h5 class="text-center text-muted mb-4">Sistem Manajemen Kebocoran Dokumen</h5>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label text-secondary">Username</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-secondary">Password</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 text-white font-weight-600 py-2">
                            Masuk Ke Sistem
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center mt-4 text-muted small">&copy; 2026 LeakTrace Corp. All rights reserved.</p>
        </div>
    </div>
</div>

</body>
</html>
